<div style="text-align: center; margin-top: 50px;">
  <h2>Tienda Kenny - Ingreso</h2>
  <form (submit)="entrar()" #loginForm="ngForm" style="display: inline-block; text-align: left; border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
    <div style="margin-bottom: 15px;">
      <label>Correo:</label><br>
      <input type="email" name="correo" [(ngModel)]="datosUsuario.correo" required style="width: 250px;">
    </div>
    <div style="margin-bottom: 15px;">
      <label>Contraseña:</label><br>
      <input type="password" name="password" [(ngModel)]="datosUsuario.password" required style="width: 250px;">
    </div>
    <button type="submit" [disabled]="!loginForm.form.valid" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Ingresar
    </button>
  </form>
</div>
